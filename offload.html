<style>
/* Offload, redesigned. Frost ground, white cards lifted by tone and shadow instead of hairlines.
   Archivo carries the interface; JetBrains Mono carries every label and every time.
   One loud element per screen: the dot-matrix time. The accent is Byakko's ice-blue eye. */
:root {
  --sans: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --ground: #edf0f4;     /* the page */
  --surface: #ffffff;    /* cards */
  --surface-2: #f5f7f9;  /* wells inside cards */
  --sunken: #e8ebf0;     /* tracks, segmented controls */
  --btn: #e7ebf0; --btn-h: #dde2e9;
  --ink: #0e131b; --ink-hover: #252e3b;
  --ink-2: #3a4350; --ink-3: #5f6977; --ink-4: #9ca5b1;
  --on-ink: #ffffff;
  --line: rgba(14, 19, 27, .07);
  --accent: #2468a8; --accent-2: #3d8bd0; --accent-soft: rgba(61, 139, 208, .13); --glow: rgba(61, 139, 208, .34);
  --ok: #12803b; --warn: #9a5c00; --bad: #c3343a;
  --bad-soft: rgba(195, 52, 58, .1);

  /* the display panel: the Now card and focus view */
  --disp: #0d141d; --disp-2: #172231; --disp-fg: #eaf2fb; --disp-dim: #93a3b8;
  --disp-line: rgba(234, 242, 251, .1); --disp-dot: rgba(234, 242, 251, .085); --disp-lit: #eef7ff; --disp-glow: rgba(124, 192, 238, .55);
  --sh-disp: 0 1px 2px rgba(13, 20, 29, .25), 0 22px 48px -22px rgba(13, 20, 29, .55);

  --dot-off: #e2e6ec; --dot-on: var(--ink);

  /* block categories, from the validated categorical order (blue, orange, aqua, yellow, magenta, green, violet) */
  --c-hw: #2a78d6; --c-cal: #eb6834; --c-build: #1baf7a; --c-meal: #eda100; --c-event: #e87ba4; --c-plan: #008300; --c-study: #6250d6;
  --c-fixed: #8b95a4; --c-rest: #d3d9e0; --c-sleep: #48526a;
  /* sequential blue, for the activity graph */
  --heat-0: #e8ebf0; --heat-1: #b7d3f6; --heat-2: #6da7ec; --heat-3: #2a78d6; --heat-4: #184f95;
  /* leisure greys for tracked time */
  --g2: #e1e5ea; --g3: #cdd3db; --g4: #b3bbc6; --g5: #98a2b0;

  --sh-1: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 6px -2px rgba(16, 24, 40, .06);
  --sh-2: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 20px -10px rgba(16, 24, 40, .12), 0 22px 44px -28px rgba(16, 24, 40, .18);
  --sh-3: 0 2px 8px rgba(16, 24, 40, .06), 0 30px 70px -22px rgba(16, 24, 40, .32);
  --sh-up: 0 -1px 0 rgba(16, 24, 40, .02), 0 14px 40px -12px rgba(16, 24, 40, .28);
  --ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent-2), 0 0 22px 3px var(--glow);
  --scrim: rgba(226, 231, 237, .62);

  --r-xl: 22px; --r-lg: 18px; --r-md: 14px; --r-sm: 11px; --r-xs: 8px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.45, .64, 1);
  --rail: 252px; --tabh: 0px;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}

    --line: rgba(237, 241, 246, .08);

    --sh-2: inset 0 1px 0 rgba(255, 255, 255, .035), 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -18px rgba(0, 0, 0, .75);
    --sh-3: inset 0 1px 0 rgba(255, 255, 255, .04), 0 34px 80px -20px rgba(0, 0, 0, .85);

  --btn: #1f2632; --btn-h: #283141;
  --ink: #edf1f6; --ink-hover: #ffffff; --ink-2: #b9c2cd; --ink-3: #8b96a5; --ink-4: #4d5765; --on-ink: #0e131b;
  --line: rgba(237, 241, 246, .08);
  --accent: #7cc0ee; --accent-2: #5aa6dc; --accent-soft: rgba(90, 166, 220, .15); --glow: rgba(124, 192, 238, .3);
  --ok: #3ccf6e; --warn: #f0b13c; --bad: #f07074; --bad-soft: rgba(240, 112, 116, .12);
  --disp: #0b121b; --disp-2: #142133; --sh-disp: 0 0 0 1px rgba(124, 192, 238, .14), 0 24px 56px -24px rgba(0, 0, 0, .85);
  --dot-off: #222935;
  --c-hw: #3987e5; --c-cal: #d95926; --c-build: #199e70; --c-meal: #c98500; --c-event: #d55181; --c-plan: #008300; --c-study: #9085e9;
  --c-fixed: #66717f; --c-rest: #2b333e; --c-sleep: #8794ad;
  --heat-0: #1b212b; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
  --g2: #2a313c; --g3: #353d4a; --g4: #4a5361; --g5: #5f6a7a;
  --sh-1: inset 0 1px 0 rgba(255, 255, 255, .03), 0 1px 2px rgba(0, 0, 0, .45);
  --sh-2: inset 0 1px 0 rgba(255, 255, 255, .035), 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -18px rgba(0, 0, 0, .75);
  --sh-3: inset 0 1px 0 rgba(255, 255, 255, .04), 0 34px 80px -20px rgba(0, 0, 0, .85);
  --sh-up: 0 18px 44px -10px rgba(0, 0, 0, .7);
  --scrim: rgba(4, 6, 9, .64);
  color-scheme: dark;
}
:root[data-ui="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html { background: var(--ground); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--ground); }
body.locked { overflow: hidden; }
::selection { background: color-mix(in srgb, var(--accent-2) 28%, transparent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 10px; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 650; letter-spacing: -0.02em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono, .eyebrow, kbd, .kbd, code { font-family: var(--mono); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

/* interactive items share one motion language: lift on hover, settle on press, a gentle scale and glow on focus */
.btn, .iconbtn, .chip, .tag, .tg, .pill, .askbtn, .nowpill, .nav-i, .tab, .tab-add, .tile, .dp, .actbtn, .qz-opt, .onb-choice, .tick, .seg button, .years button, .pal-item, .me, .badge, .trow, .tl-row, .cal-blk, .due, .inbox-list li, .minchips button, .presets .chip, .snd button, .qrow {
  transition: scale .28s var(--spring), translate .28s var(--spring), box-shadow .25s var(--ease), background-color .2s var(--ease), color .2s var(--ease), opacity .25s var(--ease);
}
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .tag:focus-visible, .tg:focus-visible, .pill:focus-visible, .askbtn:focus-visible, .nowpill:focus-visible, .nav-i:focus-visible, .tab:focus-visible, .tab-add:focus-visible, .dp:focus-visible, .actbtn:focus-visible, .tick:focus-visible, .seg button:focus-visible, .years button:focus-visible, .minchips button:focus-visible, .snd button:focus-visible { scale: 1.04; box-shadow: var(--ring); }
.tile:focus-visible, .qz-opt:focus-visible, .onb-choice:focus-visible, .me:focus-visible, .pal-item:focus-visible, .cal-blk:focus-visible { scale: 1.015; box-shadow: var(--ring); }
.btn:active, .iconbtn:active, .chip:active, .tg:active, .pill:active, .tab:active, .tab-add:active, .dp:active, .actbtn:active, .tick:active, .seg button:active, .tile:active, .qz-opt:active, .minchips button:active { scale: .965; transition-duration: .08s; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: calc(20px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); z-index: 22; }
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px; font: 760 19px/1 var(--sans); font-stretch: 108%; letter-spacing: -0.045em; }
.brand .logo, .brand-m .logo { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(14, 19, 27, .5); }
.nav { display: grid; gap: 3px; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 14px; color: var(--ink-2); font-weight: 560; letter-spacing: -0.01em; text-align: left; }
.nav-i svg { color: var(--ink-3); transition: color .2s var(--ease); }

.nav-i[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
.nav-i[aria-current="page"] svg { color: var(--accent); }
.nav-i kbd { margin-left: auto; font: 500 10.5px/1 var(--mono); color: var(--ink-4); padding: 4px 6px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.nav-i[aria-current="page"] kbd { color: var(--ink-3); background: var(--surface-2); }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.me { display: flex; align-items: center; gap: 11px; padding: 12px; border-radius: var(--r-lg); text-align: left; width: 100%; background: var(--surface); box-shadow: var(--sh-1); }
@media (hover: hover) { .me:hover { translate: 0 -1px; box-shadow: var(--sh-2); } }
.me .who { min-width: 0; flex: 1; }
.me b { display: block; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who > span { display: block; font: 500 10.5px/1.4 var(--mono); letter-spacing: .04em; color: var(--ink-3); }
.lvbar { height: 4px; border-radius: 4px; background: var(--sunken); margin-top: 7px; overflow: hidden; }
.lvbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 4px; transition: width .8s var(--ease); }
.rail-tools { display: flex; gap: 6px; padding: 0 2px; }
.av { width: 34px; height: 34px; flex: none; border-radius: 50%; overflow: hidden; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font: 650 13px/1 var(--sans); letter-spacing: -0.02em; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av > svg { width: 50%; height: 50%; stroke-width: 1.6; }
.av.anon { background: var(--sunken); color: var(--ink-3); }
.av.lg { width: 100%; height: auto; aspect-ratio: 1; max-width: 260px; font-size: 68px; font-stretch: 108%; letter-spacing: -0.05em; box-shadow: 0 0 0 5px var(--surface), var(--sh-2); }
.av.md { width: 64px; height: 64px; font-size: 22px; box-shadow: 0 0 0 3px var(--surface), var(--sh-1); }
.me .av { font-size: 13px; }
.me .av.anon { color: var(--ink-3); }
.iconbtn .av { width: 30px; height: 30px; font-size: 11px; }
.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ground) 80%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); transition: box-shadow .3s var(--ease); }
.top.scrolled { box-shadow: 0 1px 0 var(--line), 0 10px 30px -22px rgba(16, 24, 40, .4); }
.top-in { max-width: 1280px; margin: 0 auto; min-height: 64px; display: flex; align-items: center; gap: 12px; padding-left: var(--gl); padding-right: var(--gr); }
.top-title { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 12px; }
.top-title h1 { font-size: 19px; font-weight: 720; letter-spacing: -0.035em; white-space: nowrap; }
.top-title .brand-m { display: none; color: var(--ink); }
.top-title > span:last-child { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { display: flex; align-items: center; gap: 8px; }
.askbtn { display: flex; align-items: center; gap: 10px; height: 40px; width: min(330px, 34vw); padding: 0 8px 0 13px; border-radius: 14px; background: var(--surface); box-shadow: var(--sh-1); color: var(--ink-3); font-size: 13.5px; }
@media (hover: hover) { .askbtn:hover { color: var(--ink-2); translate: 0 -1px; box-shadow: var(--sh-2); } }
.askbtn .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.askbtn kbd { margin-left: auto; font: 500 10.5px/1 var(--mono); border-radius: 7px; padding: 5px 7px; color: var(--ink-3); background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font: 600 12.5px/1 var(--mono); color: var(--ink-2); white-space: nowrap; }
@media (hover: hover) { .pill:hover { color: var(--ink); translate: 0 -1px; box-shadow: var(--sh-2); } }
.pill.hot { background: var(--ink); color: var(--on-ink); }
.pill.hot svg { color: var(--c-cal); }
.pill.bump, .nowpill.bump { animation: bump .5s var(--spring); }
.nowpill { display: inline-flex; align-items: center; gap: 8px; height: 36px; max-width: 280px; padding: 0 13px 0 11px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); color: var(--ink); font-size: 13px; font-weight: 560; white-space: nowrap; }
@media (hover: hover) { .nowpill:hover { translate: 0 -1px; box-shadow: var(--sh-2); } }
.nowpill .live { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); animation: live 2.4s var(--ease) infinite; }
.nowpill .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nowpill .t { font: 600 12.5px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.iconbtn { position: relative; width: 38px; height: 38px; flex: none; display: inline-grid; place-items: center; border-radius: 12px; color: var(--ink-2); }
@media (hover: hover) { .iconbtn:hover { background: var(--btn); color: var(--ink); } }
.top-r > .iconbtn { background: var(--surface); box-shadow: var(--sh-1); }
@media (hover: hover) { .top-r > .iconbtn:hover { translate: 0 -1px; box-shadow: var(--sh-2); } }
.iconbtn.sm { width: 30px; height: 30px; border-radius: 9px; }
.sync { position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); box-shadow: 0 0 0 2px var(--surface); }
.sync[data-mode="synced"] { background: var(--ok); }
.sync[data-mode="local"] { background: var(--surface); box-shadow: 0 0 0 2px var(--surface), inset 0 0 0 1.5px var(--ink-3); }
.sync[data-mode="ro"] { background: var(--ink-3); }
.views { max-width: 1280px; margin: 0 auto; padding-block: 18px calc(64px + var(--tabh) + env(safe-area-inset-bottom, 0px)); padding-left: var(--gl); padding-right: var(--gr); }
.only-m { display: none; }

/* ---------- type ---------- */
.h-page { font: 760 clamp(30px, 3.7vw, 46px)/1.02 var(--sans); font-stretch: 110%; letter-spacing: -0.05em; }
.lede { color: var(--ink-2); font-size: 15px; margin-top: 8px; max-width: 64ch; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 30px 4px 12px; }
.sec h2 { font-size: 16px; letter-spacing: -0.02em; }
.sec .muted { font: 500 11px/1 var(--mono); letter-spacing: .06em; }

/* ---------- surfaces ---------- */
.card { position: relative; background: var(--surface); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--sh-2); min-width: 0; }
.card.wash { background: color-mix(in srgb, var(--surface) 50%, var(--ground)); box-shadow: none; }
.card .card.wash, .sheet-card .card.wash, .quiz .card.wash { background: var(--surface-2); }
.card.flat { box-shadow: none; padding: 0; background: none; }
.card.ink { background: radial-gradient(120% 95% at 100% 0%, rgba(124, 192, 238, .17), transparent 58%), linear-gradient(165deg, var(--disp-2), var(--disp)); color: var(--disp-fg); box-shadow: var(--sh-disp); --dot-off: var(--disp-dot); --dot-on: var(--disp-lit); --surface: var(--disp); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; min-width: 0; }
.card-h h2 { font-size: 15.5px; font-weight: 680; letter-spacing: -0.025em; display: flex; align-items: center; gap: 9px; }
.card-h h2 svg { color: var(--ink-3); }
.card-h .sub { font: 500 10.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: right; }
.divider { height: 0; margin: 16px 0; border: 0; }
.divider:not(:empty) { height: 1px; background: var(--line); }
.empty { padding: 20px; border-radius: var(--r-lg); background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-weight: 650; letter-spacing: -0.01em; }
.skel { position: relative; overflow: hidden; border-radius: 12px; background: var(--surface-2); height: 44px; }
.skel + .skel { margin-top: 8px; }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent); animation: shimmer 1.4s ease-in-out infinite; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 12px; border: 0; background: var(--btn); color: var(--ink); font: 600 13.5px/1 var(--sans); letter-spacing: -0.01em; white-space: nowrap; user-select: none; -webkit-user-select: none; text-decoration: none; }

@media (hover: none) { .tl-acts, .step .x { opacity: 1; } }
.step-add { display: flex; gap: 8px; }
.step-add input { height: 34px; font-size: 13px; }
.tnote { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 9px 12px; }
.tl-day-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tl-day-h h2 { font-size: 16px; font-weight: 680; letter-spacing: -0.025em; }
.tl-day-h .muted { font: 500 10.5px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; }

/* timer */
.timer-card .mxwrap { display: flex; justify-content: center; padding: 8px 0 4px; }
.timer-card .mx { width: min(100%, 270px); }
.timer-card .tbar { margin: 14px 0 16px; }
.timer-ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.presets .chip { cursor: pointer; font: 500 11.5px/1 var(--mono); }
.presets .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.presets .chip[disabled] { opacity: .45; cursor: default; }
.timer-lbl { text-align: center; font-size: 13px; color: var(--ink-3); margin-top: 10px; min-height: 20px; }
.timer-lbl b { color: var(--ink); font-weight: 560; }
.snd { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--surface-2); }
.snd > span { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); flex: none; }
.snd .sb { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.snd button { height: 28px; padding: 0 10px; border-radius: 8px; font: 600 12px/1 var(--sans); color: var(--ink-3); white-space: nowrap; }
@media (hover: hover) { .snd button:hover { color: var(--ink); background: var(--btn); } }
.snd button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
.snd input[type="range"] { width: 76px; flex: none; accent-color: var(--accent-2); }
.snd.on > span { color: var(--accent); }

/* quests, doing now, due soon, brain dump */
.quests { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.quest { display: flex; align-items: center; gap: 11px; font-size: 13.5px; }
.quest .qb { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--ink-4); display: grid; place-items: center; color: transparent; flex: none; transition: background-color .3s var(--ease), box-shadow .3s var(--ease), color .3s; }
.quest.done .qb { background: var(--ink); box-shadow: none; color: var(--on-ink); }
.quest.done .qn { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.quest .qp { margin-left: auto; font: 500 10.5px/1.3 var(--mono); color: var(--ink-3); text-align: right; }
.qbar { display: flex; gap: 4px; margin-bottom: 14px; }
.qbar i { flex: 1; height: 5px; border-radius: 5px; background: var(--sunken); transition: background-color .4s var(--ease); }
.qbar i.on { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.actgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.actbtn { display: grid; justify-items: center; gap: 5px; padding: 10px 2px 9px; border-radius: 13px; background: var(--surface-2); font: 560 11.5px/1.15 var(--sans); color: var(--ink-2); text-align: center; }
@media (hover: hover) { .actbtn:hover { background: var(--btn-h); color: var(--ink); translate: 0 -1px; } }
.actbtn.on { background: var(--ink); color: var(--on-ink); box-shadow: 0 8px 18px -10px rgba(14, 19, 27, .6); }
.doing { display: flex; align-items: center; gap: 12px; }
.doing .ico { width: 40px; height: 40px; border-radius: 13px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; flex: none; }
.doing b { display: block; font-weight: 650; letter-spacing: -0.01em; }
.doing span { font: 500 11px/1.4 var(--mono); color: var(--ink-3); }
.tbar { display: flex; height: 8px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--sunken); }
.tbar i { display: block; height: 100%; transition: width .6s var(--ease); }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font: 500 10.5px/1.3 var(--mono); color: var(--ink-3); }
.tlegend span { display: inline-flex; align-items: center; gap: 6px; }
.tlegend i { width: 8px; height: 8px; border-radius: 3px; }
.due-list, .inbox-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.due { display: flex; align-items: center; gap: 11px; padding: 8px 8px 8px 6px; border-radius: 14px; }
@media (hover: hover) { .due:hover { background: var(--surface-2); } }
.due .tb { min-width: 0; flex: 1; display: grid; gap: 1px; }
.due .tb b { font-weight: 580; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due .tb button { text-align: left; min-width: 0; }
.due .tb span { font: 500 10.5px/1.4 var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due-in { flex: none; font: 600 10.5px/1 var(--mono); letter-spacing: .04em; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); }
.due-in.soon { background: var(--accent-soft); color: var(--accent); }
.due-in.late { background: var(--bad-soft); color: var(--bad); }
.due .ti { width: 24px; height: 24px; flex: none; display: grid; place-items: center; color: var(--ink-3); }
.inbox-form { display: flex; gap: 8px; margin-bottom: 10px; }
.inbox-form .inp { height: 40px; }
.inbox-list li { display: flex; align-items: flex-start; gap: 8px; padding: 8px 6px 8px 12px; border-radius: 13px; background: var(--surface-2); }
@media (hover: hover) { .inbox-list li:hover { background: var(--btn); } }
.inbox-list .it { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere; padding-top: 5px; }
.inbox-list .it small { display: block; font: 500 10px/1.5 var(--mono); letter-spacing: .04em; color: var(--ink-3); margin-top: 2px; }
.inbox-list .acts { display: flex; gap: 2px; flex: none; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); box-shadow: var(--sh-1); font-size: 13.5px; margin-top: 16px; }
.alert > svg { flex: none; margin-top: 1px; color: var(--warn); }
.alert b { font-weight: 650; }
.alert.tour { box-shadow: var(--sh-2); background: radial-gradient(120% 140% at 0% 0%, var(--accent-soft), transparent 60%), var(--surface); }
.alert.tour > svg { color: var(--accent); }
.alert.tour ul { margin: 8px 0 14px; padding-left: 18px; display: grid; gap: 5px; color: var(--ink-2); }
.alert.tour li b { color: var(--ink); font-weight: 650; }
.mini-heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; justify-content: start; }
.mini-heat i { width: 11px; height: 11px; border-radius: 3px; background: var(--heat-0); }
.aicard .txt { font-size: 14px; display: grid; gap: 6px; }
.aicard .txt ul, .aicard .txt ol, .msg ul, .msg ol { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.aicard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; font: 500 10.5px/1.3 var(--mono); letter-spacing: .04em; color: var(--ink-3); }
.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13.5px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dot 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }

/* ---------- plan ---------- */
.plan-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 6px 2px 20px; }
.daypick { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 12px; margin: 0 -4px; scrollbar-width: none; scroll-snap-type: x proximity; }
.daypick::-webkit-scrollbar { display: none; }
.dp { flex: none; width: 60px; display: grid; justify-items: center; gap: 3px; padding: 10px 0 9px; border-radius: 16px; background: var(--surface); box-shadow: var(--sh-1); color: var(--ink-2); position: relative; scroll-snap-align: start; }
.dp span { font: 500 10px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.dp b { font: 720 19px/1.1 var(--sans); letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.dp .n { font-size: 9.5px; min-height: 12px; }
@media (hover: hover) { .dp:hover { translate: 0 -2px; box-shadow: var(--sh-2); } }
.dp.sel { background: var(--ink); box-shadow: 0 10px 22px -12px rgba(14, 19, 27, .7); }
.dp.sel span, .dp.sel b, .dp.sel .n { color: var(--on-ink); }
.dp i { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }
.plan-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; margin-top: 8px; }
.dayctl { display: grid; gap: 14px; }
.tgs { display: flex; gap: 6px; flex-wrap: wrap; }
.tg { height: 32px; padding: 0 13px; border-radius: 999px; background: var(--btn); font: 600 12.5px/1 var(--sans); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
@media (hover: hover) { .tg:hover { background: var(--btn-h); color: var(--ink); } }
.tg.on { background: var(--ink); color: var(--on-ink); }
.tg.off { text-decoration: line-through; color: var(--ink-3); background: var(--surface-2); }
.tg .muted { font: 500 10.5px/1 var(--mono); }
.tg.on .muted { color: color-mix(in srgb, var(--on-ink) 65%, transparent); }
.evs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.evs li { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13.5px; }
.evs .t { font: 500 11px/1.3 var(--mono); color: var(--ink-3); white-space: nowrap; }
.trows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.trow { display: flex; align-items: flex-start; gap: 13px; padding: 15px 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-1); }
@media (hover: hover) { .trow:hover { box-shadow: var(--sh-2); } }
.trow .tb { min-width: 0; flex: 1; display: grid; gap: 4px; }
.trow .tb b { font-weight: 600; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.trow .meta, .trow .when { font: 500 11px/1.45 var(--mono); color: var(--ink-3); }
.trow .when b { color: var(--bad); font-weight: 650; }
.trow.is-test { background: radial-gradient(140% 120% at 0% 0%, color-mix(in srgb, var(--c-event) 9%, transparent), transparent 60%), var(--surface); }
.trow.is-done .tb b { text-decoration: line-through; color: var(--ink-3); }
.tick { width: 24px; height: 24px; flex: none; border-radius: 8px; box-shadow: inset 0 0 0 1.6px var(--ink-4); display: grid; place-items: center; color: transparent; margin-top: 1px; }
@media (hover: hover) { .tick:hover { box-shadow: inset 0 0 0 1.6px var(--ink-2); color: var(--ink-4); } }
.tick.on { background: var(--ink); box-shadow: none; color: var(--on-ink); }
.tick.on svg { animation: tickIn .35s var(--spring); }
.tick.ghost { box-shadow: inset 0 0 0 1.6px var(--line); cursor: default; }
.card.ink .tick { box-shadow: inset 0 0 0 1.6px rgba(234, 242, 251, .35); }
.card.ink .tick.on { background: var(--disp-fg); color: #0e131b; }
.donebox { margin-top: 22px; }
.donebox summary { cursor: pointer; font: 500 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 10px 4px; list-style: none; }
.donebox summary::-webkit-details-marker { display: none; }
.wk-rows { display: grid; gap: 6px; }
.wk-row { display: grid; grid-template-columns: 120px 120px minmax(0, 1fr) 156px 34px; gap: 8px; align-items: center; }
.wk-row input, .wk-row select { height: 38px; padding: 0 11px; border-radius: 11px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font: 400 13.5px var(--sans); color: var(--ink); width: 100%; min-width: 0; transition: box-shadow .2s var(--ease), background-color .2s; }
.wk-row input:focus, .wk-row select:focus { outline: none; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent-2), 0 0 0 4px var(--accent-soft); }
.wk-row.fixed input[type="text"] { color: var(--ink-2); }
.wk-row input[type="time"] { padding: 0 6px 0 11px; font: 500 12.5px var(--mono); }
.wk-row input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
.alt-row { display: flex; align-items: flex-start; gap: 10px; }
.alt-row .d { width: 34px; flex: none; padding-top: 8px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.alt-row .tg svg { margin-left: 2px; opacity: .7; }
.field select.alt-add { height: 32px; width: auto; padding: 0 28px 0 12px; border-radius: 999px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font: 600 12.5px var(--sans); max-width: 200px; }
.alt-add:focus { outline: none; box-shadow: var(--ring); }
.wk-head { display: grid; grid-template-columns: 120px 120px minmax(0, 1fr) 156px 34px; gap: 8px; font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 0 4px 6px; }
.wk-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }

/* calendar */
.cal-card { padding: 20px 0 8px; overflow: hidden; }
.cal-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 20px; margin-bottom: 16px; }
.cal-head h2 { font-size: 18px; font-weight: 720; letter-spacing: -0.035em; font-stretch: 104%; margin-top: 4px; }
.cal-sum { padding: 0 20px 16px; }
.cal-sum .tbar { height: 10px; }
.cal-scroll { overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scrollbar-width: thin; padding: 0 12px 12px 0; }
.cal-grid { display: grid; grid-template-columns: 52px repeat(7, minmax(118px, 1fr)); min-width: 100%; }
.cal-axis { position: sticky; left: 0; z-index: 3; background: var(--surface); }
.cal-axis .cal-dh, .cal-axis .cal-due { visibility: hidden; }
.cal-axis .cal-body::before { display: none; }
.cal-due { height: var(--due-h, 8px); overflow: hidden; }
.cal-hr { position: absolute; right: 8px; font: 500 10px/1 var(--mono); color: var(--ink-3); translate: 0 -5px; white-space: nowrap; }
.cal-col { position: relative; scroll-snap-align: start; padding: 0 3px; }
.cal-col.today { background: linear-gradient(180deg, var(--accent-soft), transparent 140px); border-radius: 16px 16px 0 0; }
.cal-dh { height: 54px; display: grid; justify-items: center; align-content: center; gap: 2px; }
.cal-dh span { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.cal-dh b { font: 720 18px/1.1 var(--sans); letter-spacing: -0.03em; }
.cal-col.today .cal-dh b { color: var(--accent); }
.cal-due { display: grid; gap: 3px; padding: 0 2px 6px; align-content: start; }
.cal-due span { font: 600 9.5px/1.2 var(--mono); letter-spacing: .02em; padding: 4px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-due span.test { background: color-mix(in srgb, var(--c-event) 16%, var(--surface)); color: var(--ink); }
.cal-body { position: relative; }
.cal-body::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(180deg, var(--line) 0 1px, transparent 1px var(--hour)); background-position: 0 var(--off, 0); opacity: .9; pointer-events: none; }
.cal-blk { position: absolute; left: 2px; right: 2px; border-radius: 9px; padding: 4px 7px; overflow: hidden; text-align: left; background: color-mix(in srgb, var(--cat, var(--c-fixed)) 17%, var(--surface)); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cat, var(--c-fixed)) 22%, transparent); font-size: 11.5px; line-height: 1.25; }
@media (hover: hover) { .cal-blk:hover { z-index: 2; scale: 1.02; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cat) 40%, transparent), 0 10px 22px -12px rgba(16, 24, 40, .45); } }
.cal-blk b { display: block; font-weight: 620; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-blk span { display: block; font: 500 9.5px/1.3 var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-blk.tiny { padding-block: 2px; }
.cal-blk.tiny b { font-size: 10.5px; }
.cal-blk.tiny span { display: none; }
.cal-blk.micro { padding: 0; border-radius: 4px; background: color-mix(in srgb, var(--cat, var(--c-fixed)) 55%, var(--surface)); box-shadow: none; }
.cal-blk.micro b, .cal-blk.micro span { display: none; }
.cal-blk.past { opacity: .45; }
.cal-blk.fx { background: color-mix(in srgb, var(--cat, var(--c-fixed)) 11%, var(--surface-2)); }
.cal-now { position: absolute; left: -3px; right: 0; height: 2px; background: var(--ink); z-index: 4; pointer-events: none; box-shadow: 0 0 10px var(--glow); }
.cal-now::before { content: ""; position: absolute; left: -3px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.cal-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font: 500 10.5px/1.3 var(--mono); color: var(--ink-3); }
.cal-leg span { display: inline-flex; align-items: center; gap: 6px; }
.cal-leg i { width: 9px; height: 9px; border-radius: 3px; background: var(--cat); }
.cal-leg b { color: var(--ink); font-weight: 600; }

/* ---------- assistant ---------- */
.chat { max-width: 780px; margin: 0 auto; }
.chat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 2px 22px; }
.who-ai { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font: 500 11px/1 var(--mono); letter-spacing: .02em; color: var(--ink-2); }
.who-ai i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.who-ai.off i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.chat-head .iconbtn { background: var(--surface); box-shadow: var(--sh-1); }
.log { display: grid; gap: 16px; }
.msg { max-width: 92%; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; transition: opacity .4s var(--ease), translate .45s var(--ease); }
.msg p + p { margin-top: 8px; }
.msg.you { justify-self: end; background: var(--ink); color: var(--on-ink); padding: 11px 15px; border-radius: 20px 20px 6px 20px; box-shadow: 0 10px 24px -16px rgba(14, 19, 27, .7); }
.msg.ai { justify-self: start; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.msg.ai .mbadge { width: 32px; height: 32px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.msg.ai .body { display: grid; gap: 8px; min-width: 0; padding-top: 4px; }
.msg.err .body { color: var(--ink-2); }
.msg.err .mbadge { background: var(--bad-soft); color: var(--bad); }
.msg code { font: 12.5px var(--mono); background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
.acard { border-radius: var(--r-lg); padding: 10px; display: grid; gap: 8px; background: var(--surface); box-shadow: var(--sh-1); }
.acard h4 { margin: 4px 6px; font: 500 10.5px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.applied { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); color: var(--ok); padding: 2px 6px 6px; }
.cut { display: block; font: 500 10.5px/1.4 var(--mono); color: var(--ink-3); }
.cchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 0; }
.cchips .chip { cursor: pointer; height: 32px; background: var(--surface); box-shadow: var(--sh-1); }
@media (hover: hover) { .cchips .chip:hover { translate: 0 -1px; box-shadow: var(--sh-2); } }
.composer { position: sticky; bottom: calc(var(--tabh) + 14px + env(safe-area-inset-bottom, 0px)); margin-top: 20px; z-index: 5; }
.composer-in { display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 22px; background: var(--surface); box-shadow: var(--sh-3); transition: box-shadow .3s var(--ease); }
.composer-in:focus-within { box-shadow: var(--sh-3), 0 0 0 2px var(--accent-2), 0 0 34px -4px var(--glow); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; max-height: 160px; height: 40px; padding: 9px 8px; font: 400 15.5px/1.45 var(--sans); color: var(--ink); }
.composer textarea:focus-visible { box-shadow: none; }
.composer .btn { height: 40px; width: 40px; padding: 0; border-radius: 14px; }

.focus { position: fixed; inset: 0; z-index: 65; background: radial-gradient(90% 70% at 50% 30%, #172a40, transparent 70%), var(--disp); color: var(--disp-fg); --dot-off: var(--disp-dot); --dot-on: var(--disp-lit); --ink-3: var(--disp-dim); --surface: var(--disp); --btn: rgba(234, 242, 251, .09); --btn-h: rgba(234, 242, 251, .16); --ink: var(--disp-fg); --ink-hover: #ffffff; --ink-2: #c6d2e0; --on-ink: #0e131b; --ink-4: rgba(234, 242, 251, .3); --line: rgba(234, 242, 251, .1); --surface-2: rgba(234, 242, 251, .06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(24px + env(safe-area-inset-top, 0px)) var(--gr) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gl); text-align: center; animation: fadeIn .4s var(--ease); }

    const [ry, rm] = String(r.start).split('-').map(Number);
    const d = parseISO(date);
    const steps = (d.getFullYear() - ry) * 12 + (d.getMonth() + 1) - rm;
    return Math.max(toMin(r.from) - (Number(r.step) || 15) * Math.max(0, steps), toMin(r.to));

  function lightsOut(date, settings) {

    const floor = settings && settings.bedtimeFloor && settings.bedtimeFloor[dow(date)];
    if (floor) L = Math.max(L, toMin(floor));
    return L;
  }

  // ---------- block builders ----------
  function mk(date, row) {
    const start = toMin(row.start), end = toMin(row.end), meta = R(row.role);
    const fixed = typeof row.fixed === 'boolean' ? row.fixed : !!meta.fixed;
    const b = { id: `${date}-${row.id}`, rowId: row.id, role: row.role, label: row.label || meta.name, start, end, t0: start, pref: end - start, fixed, cat: meta.cat };
    if (row.group) b.group = row.group;

  function fixedBlock(id, start, end, role, label) {

  function replaceRun(blocks, pred, make) {

    return [...blocks.slice(0, i), ...make(blocks[i], blocks[j]), ...blocks.slice(j + 1)];

  const byStart = (a, b) => a.start - b.start || a.end - b.end;

  // Legacy day fields (clubOff, ptOff) read as switched-off groups.
  function offOf(day) {
    const off = Object.assign({}, (day && day.off) || {});
    if (day && day.clubOff) off.club = true;
    if (day && day.ptOff) off.pt = true;
    return off;
  }
  function pickTemplate(date, day, week) {
    const T = week.templates, w = dow(date);
    if (day.variant && T[day.variant]) return day.variant;
    const d = week.defaults[w];
    if (d && T[d]) return d;
    return null;
  }
  const variantsFor = (week, w) => {
    const def = week.defaults[w];
    const list = [def].concat(week.variants[w] || []).filter((k, i, a) => k && week.templates[k] && a.indexOf(k) === i);
    return list;
  };

  // ---------- fitting ----------
  // Cut order: free time first, then self-study (linear algebra, CAD, Python, Physics C, study),
  // then the app/build sprint shrinks to 10 min. Homework goes last.
  const CUTS = [
    ['free', 0], ['open', 0], ['games', 15], ['break', 5], ['snack', 10],
    ['la', 'trim20'], ['cad', 'trim20'], ['python', 'trim20'], ['study', 'trim20'], ['physc', 'trim30'],
    ['app', 10], ['build', 10], ['cal', 10], ['meal', 20], ['games', 0], ['break', 0], ['reset', 15],
    ['hw', 20], ['app', 0], ['build', 0], ['hw', 0], ['cal', 0], ['snack', 0], ['reset', 0], ['meal', 15], ['meal', 0],
  ];
  const FREEISH = new Set(['free', 'open']);
  function mergeFree(blocks) {
    const out = [];
    for (const b of blocks) {
      const prev = out[out.length - 1];
      if (prev && !prev.fixed && !b.fixed && FREEISH.has(prev.role) && FREEISH.has(b.role) && !prev.status && !b.status && prev.end === b.start && !prev.added && !b.added) {
        out[out.length - 1] = Object.assign({}, prev, { end: b.end, pref: b.end - prev.start, role: prev.role === 'free' && b.role === 'free' ? 'free' : 'open', label: prev.label === b.label ? prev.label : 'Free' });
      } else out.push(b);
    }
    return out;
  }
  function track(b, minutes, lost) {
    if (lost && Object.prototype.hasOwnProperty.call(lost, b.role) && minutes > 0) lost[b.role] += minutes;
  }
  function applyCuts(list, D, lost) {
    for (const [role, rule] of CUTS) {
      if (D <= 0) break;
      for (let i = list.length - 1; i >= 0 && D > 0; i--) {
        const b = list[i];
        if (b.role !== role || b.dur <= 0) continue;
        if (typeof rule === 'number') {
          const cut = Math.min(b.dur - rule, D);
          if (cut <= 0) continue;
          b.dur -= cut; D -= cut; track(b, cut, lost);
        } else {
          const floor = Number(rule.slice(4));
          const cut = Math.min(b.dur, D), left = b.dur - cut;
          if (left < floor) { D -= b.dur; track(b, b.dur, lost); b.dur = 0; }
          else { b.dur = left; D -= cut; track(b, cut, lost); }

    // Anything still over (roles outside the cut list) shrinks from the end.
    for (let i = list.length - 1; i >= 0 && D > 0; i--) {
      const b = list[i]; if (b.dur <= 0) continue;

  }
  function fitSegment(items, s, e, lost, frontWindow) {
    let list = items.map((b) => Object.assign({}, b, { dur: b.pref })).sort((a, b) => a.t0 - b.t0);
    // In a replan the block already in progress stays first; a meal that is due
    // (or overdue) moves ahead of the rest.
    const current = frontWindow ? list.filter((b) => b.start < s && b.end > s) : [];
    const front = list.filter((b) => !current.includes(b) && b.role === 'meal' && (frontWindow ? b.t0 <= s + frontWindow : b.t0 < s));
    list = current.concat(front, list.filter((b) => !front.includes(b) && !current.includes(b)));
    let D = list.reduce((a, b) => a + b.dur, 0) - (e - s);
    if (D > 0) applyCuts(list, D, lost);
    list = list.filter((b) => b.dur > 0);
    let t = s;
    for (const b of list) { b.start = t; b.end = t + b.dur; t = b.end; delete b.dur; }

    else if (e > t) { if (list.length) list[list.length - 1].end = e; else list.push(openBlock(`open-${t}`, t, e)); }
    return list;
  }
  function fitBlocks(blocks, lost) {

    const flex = blocks.filter((b) => !b.fixed);
    if (!fixed.length) {
      if (!flex.length) return [];
      const lo = Math.min(...flex.map((b) => b.t0)), hi = Math.max(...flex.map((b) => b.t0 + b.pref));

    }
    const iv = [];
    for (const b of fixed) {
      const last = iv[iv.length - 1];
      if (last && b.start <= last[1]) last[1] = Math.max(last[1], b.end); else iv.push([b.start, b.end]);
    }
    // The day ends at lights-out: nothing flexible goes after the wind-down.
    const wind = fixed.filter((b) => b.role === 'wind').pop();
    const lo = Math.min(...blocks.map((b) => b.start));
    const hi = wind ? wind.end : Math.max(...blocks.map((b) => b.end));
    const segs = []; let cur = lo;
    for (const [s, e] of iv) { if (s > cur && Math.min(s, hi) > cur) segs.push([cur, Math.min(s, hi)]); cur = Math.max(cur, e); }
    if (hi > cur) segs.push([cur, hi]);
    const bucket = segs.map(() => []);
    for (const b of flex) {
      let k = segs.findIndex(([s, e]) => b.t0 >= s && b.t0 < e);
      if (k < 0) k = segs.findIndex(([s]) => s >= b.t0); // starts inside a fixed block: next gap
      if (k < 0) k = segs.length - 1;                     // after the last gap (e.g. past an earlier lights-out)
      if (k < 0) { track(b, b.pref, lost); continue; }
      bucket[k].push(b);
    }
    const out = fixed.slice();
    segs.forEach(([s, e], k) => {
      if (bucket[k].length) out.push(...fitSegment(bucket[k], s, e, lost, 0));
      else if (e - s >= 10) out.push(openBlock(`open-${s}`, s, e));
    });
    return mergeFree(out.sort(byStart));
  }

  // ---------- today's log: done / skipped / replan from now ----------
  // A replan re-fits only the current gap (from now to the next fixed block).
  // Blocks that already passed stay where they were; homework tasks still open
  // flow into later homework time on their own, so nothing is pushed past bedtime.
  function applyLog(blocks, log, lost) {
    const closed = log.closed || {};
    const out = blocks.map((b) => {
      if (!closed[b.id] || b.fixed) return b;
      if (closed[b.id] === 'skipped') track(b, b.end - b.start, lost);
      return Object.assign({}, b, { status: closed[b.id] });
    });
    const R0 = log.replanAt;
    if (R0 == null) return out;
    const fixed = out.filter((b) => b.fixed).sort(byStart);
    let Rm = R0;
    for (const b of fixed) if (b.start <= Rm && Rm < b.end) Rm = b.end;
    const next = fixed.find((b) => b.start >= Rm);
    const segEnd = next ? next.start : Rm;
    const pending = [], keep = [];
    for (const b of out) {
      if (b.fixed) { keep.push(b); continue; }
      if (b.status) {
        if (b.start < R0) keep.push(b.end > R0 ? Object.assign({}, b, { end: R0 }) : b);
        else if (b.start >= segEnd) keep.push(openBlock(`${b.id}-freed`, b.start, b.end, 'Free'));
        continue; // a closed block inside the re-fit window just frees its time
      }
      if (segEnd > Rm && b.end > Rm && b.start < segEnd) pending.push(Object.assign({}, b, { pref: b.end - b.start, shifted: true }));
      else keep.push(b);
    }
    const fitted = segEnd > Rm ? fitSegment(pending, Rm, segEnd, lost, 30) : [];
    return mergeFree(keep.concat(fitted).sort(byStart));
  }

  // ---------- one day ----------
  function layoutDay(date, ctx) {
    const settings = ctx.settings || {};
    const week = weekOf(ctx);
    const day = (ctx.days && ctx.days[date]) || {};
    const w = dow(date);
    const tpl = pickTemplate(date, day, week);
    const T = tpl ? week.templates[tpl] : null;
    let blocks = T ? (T.rows || []).filter((r) => r && r.start && r.end && toMin(r.end) > toMin(r.start)).map((row) => mk(date, row)) : [];
    // groups: switched off for this date, or only on certain weekdays
    const off = offOf(day);
    for (const [g, G] of Object.entries(week.groups || {})) {
      const has = blocks.some((b) => b.group === g);
      let on = !off[g];
      if (Array.isArray(G.days)) on = on && G.active !== false && G.days.includes(w);
      if (!on && has) {
        let guard = 0;
        while (blocks.some((b) => b.group === g) && guard++ < 6) {
          blocks = replaceRun(blocks, (b) => b.group === g, (first, last) => {
            const fid = `${date}-${tpl}-no${g}${guard > 1 ? guard : ''}`;
            if (Array.isArray(G.offAs) && G.offAs.length) {
              const rows = G.offAs.map((r, i) => fixedBlock(`${date}-${tpl}-${g}off${i}`, toMin(r.start), toMin(r.end), r.role || 'travel', r.label || 'Travel'));
              const after = Math.max(first.start, ...rows.map((b) => b.end));
              if (last.end > after) rows.push(openBlock(fid, after, last.end, `Free (${String(first.label).split(' (')[0].toLowerCase()} is off)`));
              return rows;
            }
            return [openBlock(fid, first.start, last.end, G.freeLabel || `Free (${String(first.label).split(' (')[0].toLowerCase()} is off)`)];
          });
        }
      } else if (on && !has && Array.isArray(G.days) && G.inject && w >= 1 && w <= 5 && T) {
        const inj = fixedBlock(`${date}-${g}-inject`, toMin(G.inject.start), toMin(G.inject.end), G.inject.role || 'pt', G.inject.label || G.name || 'Appointment');
        inj.group = g;
        blocks.push(inj);
      }
    }
    if (day.noSchool && w >= 1 && w <= 5) {
      blocks = blocks.map((b) => (b.role === 'school' || b.role === 'studyhall')
        ? Object.assign({}, b, { role: 'free', fixed: false, cat: 'rest', label: 'No school', rowDetail: undefined }) : b);
    }
    if (day.easy) {
      blocks = blocks.map((b) => (R(b.role).study ? Object.assign({}, b, { role: 'free', cat: 'rest', label: 'Free (easy day)', was: b.role, rowDetail: undefined }) : b));
    }
    // one-off edits of template blocks for this date
    const edits = day.edits || {};
    if (Object.keys(edits).length) {
      blocks = blocks.filter((b) => !(b.rowId && edits[b.rowId] && edits[b.rowId].removed)).map((b) => {
        const ed = b.rowId && edits[b.rowId];
        if (!ed) return b;
        const nb = Object.assign({}, b, { edited: true });
        if (ed.label) nb.label = ed.label;
        if (ed.start || ed.end) {
          const s = ed.start ? toMin(ed.start) : b.start;

    for (const ev of day.events || []) {
      const s = toMin(ev.start), e = toMin(ev.end);
      if (!(e > s)) continue;
      blocks.push({ id: `${date}-ev-${ev.id}`, role: 'event', label: ev.title || 'Busy', start: s, end: e, t0: s, pref: e - s, fixed: true, cat: 'event', evId: ev.id });
    }
    for (const a of day.adds || []) {
      const s = toMin(a.start), e = toMin(a.end);
      if (!(e > s)) continue;
      const role = ROLES[a.role] ? a.role : 'event';
      const fixed = typeof a.fixed === 'boolean' ? a.fixed : !!R(role).fixed;
      blocks.push({ id: `${date}-add-${a.id}`, addId: a.id, role, label: a.title || R(role).name, start: s, end: e, t0: s, pref: e - s, fixed, cat: R(role).cat, added: true });
    }

    for (const k of Object.keys(ROLES)) if (ROLES[k].study) lost[k] = 0;

    const log = ctx.logs && ctx.logs[date];
    if (date === ctx.today && log) blocks = applyLog(blocks, log, lost);
    for (const b of blocks) {
      const tt = trackText(week, b.role, date);
      const parts = [tt, b.rowDetail].filter(Boolean);
      if (parts.length) b.detail = parts.join('. ');

    const wake = firstRow != null ? firstRow : (blocks.length ? Math.min(...blocks.map((b) => b.start)) : toMin('07:00'));
    return { date, dow: w, template: tpl, templateName: T ? (T.name || tpl) : '', work: !!(T && T.work), easy: !!day.easy, blocks, lost, lightsOut: L, wake, day, empty: !T };
  }

  // ---------- tasks -> slots ----------
  // Learned multipliers (from check-outs) stretch or trim homework estimates per subject.
  // Minutes entered as "this much is left" are already real, so they're left alone.
  function adjMinutes(t, mults) {
    const base = Math.max(5, Number(t.minutes) || 30);
    const m = mults && t.est !== 'real' && mults[t.subject || 'Other'] ? mults[t.subject || 'Other'].mult : 1;
    return m === 1 ? base : Math.max(5, Math.round((base * m) / 5) * 5);
  }
  function demandsFrom(tasks, today, mults) {
    const out = [];
    for (const t of tasks || []) {
      if (t.done) continue;
      if (t.kind === 'test') {
        if (!t.date || t.date < today) continue;
        const total = Math.max(15, Number(t.study) || 90);
        const per = Math.max(10, Math.round(total / 3 / 5) * 5);
        for (let i = 3; i >= 1; i--) {
          out.push({ id: `${t.id}:${i}`, task: t, kind: 'study', title: `Study: ${t.title || 'test'}`, minutes: per, due: t.date, earliest: addDays(t.date, -i), hard: true });
        }
      } else if (t.kind === 'project') {
        if (!t.due) continue;
        out.push({ id: t.id, task: t, kind: 'project', title: t.title || 'Project', minutes: Math.max(15, Number(t.minutes) || 120), due: t.due, earliest: '0000-00-00', perDay: 60, hard: !!t.hard });
      } else {
        out.push({ id: t.id, task: t, kind: 'hw', title: t.title || 'Homework', minutes: adjMinutes(t, mults), due: t.due || addDays(today, 1), earliest: '0000-00-00', hard: !!t.hard });
      }
    }
    for (const d of out) {
      d.late = d.kind !== 'study' && d.due <= today;
      d.effDue = d.late ? addDays(today, 1) : d.due;

    }

  }
  const STUDY_PREF = { la: 0, cad: 1, python: 2, study: 2, physc: 3 };
  function assignTasks(layouts, ctx) {
    const today = ctx.today, now = ctx.nowMin == null ? 0 : ctx.nowMin;
    const demands = demandsFrom(ctx.tasks, today, ctx.mults);
    const dates = Object.keys(layouts).filter((d) => d >= today).sort();
    const byBlock = {};
    const capOf = (b, d) => {
      if (b.status) return 0;
      if (d === today) { if (b.end <= now) return 0; return b.end - Math.max(b.start, now); }
      return b.end - b.start;
    };
    const slots = (pred) => {
      const arr = [];
      for (const d of dates) for (const b of layouts[d].blocks) {
        if (!pred(b, d)) continue;
        const cap = capOf(b, d);
        if (cap >= 10) arr.push({ date: d, block: b, cap });
      }
      return arr;
    };
    const order = (slot) => (a, b) => a.effDue.localeCompare(b.effDue)
      || (slot.block.role === 'studyhall' ? a.left - b.left : (b.hard - a.hard))
      || ((a.kind === 'project') - (b.kind === 'project'))
      || String(a.id).localeCompare(String(b.id));
    const fill = (slot, within3) => {
      const elig = demands.filter((x) => x.left > 0 && slot.date < x.effDue && slot.date >= x.earliest
        && !(slot.block.role === 'studyhall' && x.kind === 'project') // study hall is for quick assignments
        && (!within3 || daysBetween(slot.date, x.effDue) <= 3)
        && (!x.perDay || (x.byDate[slot.date] || 0) < x.perDay)).sort(order(slot));
      let used = 0;
      for (const x of elig) {
        if (slot.cap < 10) break;
        let take = Math.min(x.left, slot.cap);
        if (x.perDay) take = Math.min(take, x.perDay - (x.byDate[slot.date] || 0));
        if (take < 10 && x.left > take) continue;
        (byBlock[slot.block.id] = byBlock[slot.block.id] || []).push({ id: x.id, taskId: x.task.id, title: x.title, subject: x.task.subject || '', minutes: take, late: x.late, kind: x.kind });
        x.left -= take; slot.cap -= take; used += take;
        x.byDate[slot.date] = (x.byDate[slot.date] || 0) + take;
        x.slots.push({ date: slot.date, blockId: slot.block.id, start: slot.block.start, label: slot.block.label, minutes: take });
      }
      return used;
    };
    // 1: homework blocks and study hall
    for (const s of slots((b) => b.role === 'hw' || b.role === 'studyhall')) fill(s, false);
    // 2: free time opened up by cancellations (not time just freed by finishing or skipping)
    const todayLog = (ctx.logs && ctx.logs[today]) || {};
    for (const s of slots((b, d) => b.role === 'open' && !(d === today && todayLog.replanAt != null && b.start >= todayLog.replanAt))) fill(s, false);
    // 3: school first: within 3 days of a due date, homework takes over self-study
    if (demands.some((x) => x.left > 0)) {
      const study = slots((b) => !!R(b.role).study && !b.takeover)
        .sort((a, b) => a.date.localeCompare(b.date) || (STUDY_PREF[a.block.role] ?? 2) - (STUDY_PREF[b.block.role] ?? 2) || a.block.start - b.block.start);
      for (const s of study) {
        if (!demands.some((x) => x.left > 0)) break;
        const used = fill(s, true);
        if (used > 0) {
          const b = s.block, orig = b.role;
          b.takeover = orig; b.label = `Homework (instead of ${R(orig).name})`;
          b.role = 'hw'; b.cat = 'hw'; b.detail = undefined;
          if (trackFor(weekOf(ctx), orig) && layouts[s.date].lost[orig] != null) layouts[s.date].lost[orig] += b.end - b.start; // paced tracks get made up
        }
      }
    }
    // 4: weekend free time, only within 3 days of a due date
    if (demands.some((x) => x.left > 0)) {
      for (const d of dates) {
        const L = layouts[d];
        if (L.dow !== 0 && L.dow !== 6) continue;
        const closedToday = (ctx.logs && ctx.logs[d] && ctx.logs[d].closed) || {};
        if (Object.keys(closedToday).some((k) => k.startsWith(`${d}-catch`))) continue;
        let k = 0;
        for (const b of L.blocks.slice()) {
          if (b.role !== 'free' || capOf(b, d) < 30) continue;
          const slot = { date: d, block: { id: `${d}-catch-${k++}`, start: b.start, label: 'Catch-up homework', role: 'hw' }, cap: Math.min(90, capOf(b, d)) };
          const used = fill(slot, true);
          if (used > 0) {
            const start = d === ctx.today ? Math.max(b.start, now) : b.start;
            const hwb = { id: slot.block.id, role: 'hw', cat: 'hw', label: 'Catch-up homework', start, end: start + used, t0: start, pref: used, fixed: false };
            const i = L.blocks.indexOf(b);
            const parts = [hwb];
            if (start > b.start) parts.unshift(Object.assign({}, b, { end: start }));
            if (b.end > hwb.end) parts.push(Object.assign({}, b, { id: `${b.id}-rest`, start: hwb.end, t0: hwb.end }));
            L.blocks.splice(i, 1, ...parts);
          }
        }
      }
    }
    const shortfall = demands.filter((x) => x.left > 0).map((x) => ({ id: x.id, taskId: x.task.id, title: x.title, left: x.left, due: x.due, late: x.late }));
    const byTask = {};
    for (const x of demands) (byTask[x.task.id] = byTask[x.task.id] || []).push(...x.slots);
    return { byBlock, byTask, shortfall, demands };
  }

  // ---------- weekend makeup for self-study cut on weekdays ----------
  function applyMakeup(layouts, ctx) {
    const week = weekOf(ctx);
    const rules = week.makeup || [];
    const weeks = {};
    for (const d of Object.keys(layouts)) (weeks[mondayOf(d)] = weeks[mondayOf(d)] || []).push(d);
    const summary = {};

/* ===== timer: focus (Pomodoro), countdown and stopwatch; focus sessions earn XP ===== */
const TIMER_KEY = 'offload.timer';
const TIMER_DEFAULTS = { mode: 'focus', focusMin: 25, breakMin: 5, countMin: 10, phase: 'focus', running: false, endAt: 0, left: null, swStart: 0, swAcc: 0, label: '', startedAt: 0, focusedMs: 0, cycles: 0, bonus: 0 };
const timer = Object.assign({}, TIMER_DEFAULTS, lsGet(TIMER_KEY) || {});
const saveTimer = () => lsSet(TIMER_KEY, timer);
const FOCUS_PRESETS = [[25, 5], [50, 10], [90, 15]];
const COUNT_PRESETS = [5, 10, 15, 30, 60];
function timerTotalMs() {
  const extra = (timer.bonus || 0) * 60000;
  if (timer.mode === 'focus') return (timer.phase === 'break' ? timer.breakMin : timer.focusMin) * 60000 + extra;
  if (timer.mode === 'countdown') return timer.countMin * 60000 + extra;
  return 0;
}
function timerLeftMs() {

}

}

    if (timer.mode === 'focus' && timer.phase === 'focus' && !timer.label) { const cur = curBlock(); timer.label = cur && FOCUS_ROLES.has(cur.role) ? cur.label : ''; }
    if (timer.mode === 'focus' && timer.phase === 'focus') { const a = curAct(); if (!a || !['homework', 'study', 'build'].includes(a.k)) setAct('study', { quiet: true }); }
  }
  saveTimer(); drawTimerCard(); tick(true);
}

  if (timer.mode === 'stopwatch') { timer.swAcc = swElapsed(); timer.running = false; }
  else { timer.left = timerLeftMs(); timer.running = false; }

}

/* ===== assistant: chat, the command bar, day detailing, game plan, weekly review ===== */
function md(src) {
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let html = '', list = null;
  for (const raw of esc(src).split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const ul = line.match(/^\s*(?:[-*•])\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (list !== tag) { if (list) html += `</${list}>`; html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
      continue;
    }
    if (list) { html += `</${list}>`; list = null; }
    if (!line.trim()) continue;
    const hd = line.match(/^#{1,4}\s+(.*)$/) || line.match(/^([A-Z][A-Z ]{2,}):?$/);
    html += hd ? `<p><b>${inline(hd[1])}</b></p>` : `<p>${inline(line)}</p>`;
  }
  if (list) html += `</${list}>`;
  return html;
}
const AI_HIDE = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed']);
function aiErr(e) {
  const code = (e && e.code) || 'upstream_error';
  if (AI_HIDE.has(code)) return 'Claude isn’t allowed in this view. Offline commands still work, or add your own AI key in Settings.';
  return ({
    images_unavailable: 'Photos can’t be sent from this view. Type it instead.',
    image_rejected: 'That photo didn’t work. Try a clearer or smaller one.',
    rate_limited: 'Too many requests right now. Try again in a minute.',
    session_expired: 'Sign in again to use AI features.',
    refused: 'The AI couldn’t help with that one. Try asking a different way.',
    invalid_json: 'That didn’t come back in a usable shape. Try again.',
    prompt_too_large: 'That was too long. Try something shorter.',
    empty_completion: 'No answer came back. Try rephrasing.',
    not_available: 'No AI is set up. Offline commands still work; add a free key in Settings for more.',
  })[code] || (e && e.message) || 'That didn’t come through. Try again.';
}

// ---------- the change vocabulary an AI uses ----------
function itemsSpec() {
  return `Each change is one JSON object:

{"type":"test","subject":"<class>","title":"...","date":"YYYY-MM-DD","studyMinutes":90}
{"type":"project","subject":"<class>","title":"...","due":"YYYY-MM-DD","minutes":240}
{"type":"event","date":"YYYY-MM-DD","title":"...","start":"HH:MM","end":"HH:MM"}  (fixed busy time; the plan moves around it)
{"type":"add_block","date":"YYYY-MM-DD","title":"...","start":"HH:MM","end":"HH:MM","role":"study|hw|build|cal|meal|break|free|reset|event"}  (one-off block; non-fixed roles flex to fit)
{"type":"move_block","date":"YYYY-MM-DD","id":"<block id>","start":"HH:MM","end":"HH:MM"}  (that date only)
{"type":"remove_block","date":"YYYY-MM-DD","id":"<block id>"}  (that date only)
{"type":"rename_block","date":"YYYY-MM-DD","id":"<block id>","title":"..."}
{"type":"steps","date":"YYYY-MM-DD","id":"<block id>","steps":["...","..."],"note":"optional"}  (a short checklist for one block)
{"type":"off","date":"YYYY-MM-DD","group":"<group>","on":false}  (switch a group off for one date; on:true puts it back)
{"type":"school","date":"YYYY-MM-DD","on":false}  (no school that day)
{"type":"easy","date":"YYYY-MM-DD","on":true}  (self-study becomes free time)
{"type":"variant","date":"YYYY-MM-DD","key":"<day type key>"}
{"type":"update_task","id":"<task id>","due":"YYYY-MM-DD","date":"YYYY-MM-DD","minutes":45,"studyMinutes":60}  (only fields that change)
{"type":"done_task","id":"<task id>"}
{"type":"close","date":"<today>","id":"<block id>","status":"done|skipped"}  (today only)
{"type":"replan"}  (re-fit the rest of today from now)
{"type":"add_row","dows":[1,2,3,4,5],"start":"HH:MM","end":"HH:MM","title":"...","role":"..."}  (a RECURRING block in the weekly routine; only when asked for "every ..." )

Classes: ${subjectNames().join(', ')}. For "subject" use one of these names exactly; if they name a class that isn't listed, use a short name for it (it gets added to their classes). Use 24-hour times and block ids exactly as listed. Resolve "tomorrow", "fri", "next tue" to dates on or after today.`;

// ---------- the command bar: AI when there is one, offline commands always ----------
async function askSubmit(text, from) {
  text = String(text || '').trim();
  if (!text || state.ask.busy) return;
  if (state.readOnly) { viewOnly(); return; }
  C = compute();
  const a = state.ask;
  Object.assign(a, { busy: true, items: null, err: '', note: '', from: '', busyText: 'Reading that…' });
  if (state.tab !== 'today' && from !== 'palette') { /* stays where it was asked */ }
  render();
  // instant actions the offline parser is sure about
  const off = NLP.parse(text, nlpCtx());
  const instant = off.items.filter((x) => x.type === 'timer' || x.type === 'detail');
  if (instant.length && off.items.length === instant.length && !off.unknown.length) {
    a.busy = false; render();
    for (const it of instant) {
      if (it.type === 'timer') { timer.mode = 'focus'; timer.phase = 'focus'; timer.focusMin = it.minutes; timer.left = null; if (it.label) timer.label = it.label; timerStart(); toast(`Focus timer: ${it.minutes} min${it.label ? ` on ${it.label}` : ''}.`, 'timer'); }
      if (it.type === 'detail') detailDay(it.date);
    }
    $('#ask-in').value = ''; autoGrow($('#ask-in'));
    return;
  }
  let items = null, note = '', fromWho = 'offline';
  if (AI.active()) {
    try {
      a.ctl = new AbortController();
      const res = await AI.ask({ json: true, tier: 'quick', signal: a.ctl.signal, messages: [{ role: 'user', content: itemsPrompt('Turn the user’s note into changes to their plan.', text) }] });
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.items) ? res.items : []);
      items = arr.map(normItem).filter(Boolean);
      note = res && !Array.isArray(res) && res.note ? String(res.note).slice(0, 200) : '';
      fromWho = 'ai';
      if (!items.length && off.items.length) { items = null; note = ''; }
    } catch (e) {
      if (e && e.code === 'cancelled') { a.busy = false; render(); return; }
      note = `${aiErr(e)} Used offline commands instead.`;
      items = null;
    }
  }
  if (!items) {
    items = off.items.filter((x) => x.type !== 'timer' && x.type !== 'detail').map(normItem).filter(Boolean);
    fromWho = 'offline';
    const det = off.items.find((x) => x.type === 'detail');
    if (det) detailDay(det.date);
    if (off.unknown.length) note = `${note ? note + ' ' : ''}Didn’t catch: “${off.unknown.join('”, “')}”. Try “calc hw due fri 30m”, “no club tomorrow”, “dentist 3-4pm thu”, “move gym to 6”.`;
  }
  Object.assign(a, { busy: false, items: items.length ? items : null, note, from: fromWho, ctl: null });
  if (!items.length && !note) a.note = 'Nothing to change in that.';
  render();
}
async function askApply() {
  const a = state.ask;
  if (!a.items) return;
  const items = picked(a.items, 'ask');
  if (!items.length) { toast('Nothing selected.'); return; }
  const n = await applyItems(items);
  Object.assign(a, { items: null, note: '', err: '' });
  $('#ask-in').value = ''; autoGrow($('#ask-in'));
  // a brain-dump line that became real plan changes is done
  if (n && a.inboxId) { state.inbox = state.inbox.filter((x) => x.id !== a.inboxId); Data.saveInbox(); }
  a.inboxId = null;
  render();

const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

}
// A time chart: x in ms. series: [{kind:'line'|'proj'|'ref'|'band'|'dots', pts:[{x,y,y0?,y1?}]}]

  const mx = (e.clientX - box.left) / k;

  for (const p of pts) if (Math.abs(p.x - mx) < Math.abs(best.x - mx)) best = p;
  cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.setAttribute('visibility', 'visible');
  tip.innerHTML = best.t; tip.hidden = false;
  tip.style.left = `${best.x * k}px`; tip.style.top = `${best.y * k}px`;
}

// A bar with a 4px rounded data end, square at the baseline.
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x.toFixed(1)},${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`;
}
function focusChart(series) {
  const W = cardWidths().half, H = 150, padL = 28, padB = 20, n = series.length, bw = (W - padL) / n;
  let g = '';
  for (const v of [25, 50, 75, 100]) { const y = (H - padB) * (1 - v / 100); g += `<line class="grid" x1="${padL}" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="lab" x="0" y="${(y + 3.5).toFixed(1)}">${v}</text>`; }
  series.forEach((p, i) => {
    if (p.v == null) return;
    const h = Math.max(2, (H - padB) * (p.v / 100)), w = Math.min(24, bw * 0.64), x = padL + i * bw + (bw - w) / 2;
    g += `<path class="fbar${i === n - 1 ? ' today' : ''}" d="${barPath(x, H - padB - h, w, h, 4)}"><title>${esc(shortDate(p.d))}: ${p.v}</title></path>`;
  });
  const pts = series.map((p, i) => (p.avg == null ? null : `${(padL + i * bw + bw / 2).toFixed(1)},${((H - padB) * (1 - p.avg / 100)).toFixed(1)}`)).filter(Boolean);
  if (pts.length > 1) g += `<polyline class="avg" points="${pts.join(' ')}"/>`;
  [0, 7, 14, 21, n - 1].forEach((i) => { if (series[i]) g += `<text class="lab" x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${i === n - 1 ? 'today' : monDay(series[i].d)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Focus score for the last four weeks">${g}</svg>`;
}

function timeCard() {

function heatSVG(range) {
  const cd = contribData();

  const weeks = Math.ceil((E.daysBetween(start, end) + 1) / 7);
  const W = left + weeks * P, H = topPad + 7 * P;
  let g = '', lastMonth = -1, total = 0;
  const lo = range === 'last' ? E.addDays(C.today, -364) : `${range}-01-01`, hi = range === 'last' ? C.today : `${range}-12-31`;
  for (let w = 0; w < weeks; w++) {
    const first = E.addDays(start, w * 7), fm = E.parseISO(first).getMonth();
    const firstIn = Array.from({ length: 7 }, (_, r) => E.addDays(first, r)).find((d) => d >= lo && d <= hi);
    if (firstIn) { const mo = E.parseISO(firstIn).getMonth(); if (mo !== lastMonth && E.parseISO(firstIn).getDate() <= 7) { g += `<text class="ml" x="${left + w * P}" y="11">${MON3[mo]}</text>`; lastMonth = mo; } else if (lastMonth === -1) lastMonth = mo; }
    void fm;
    for (let r = 0; r < 7; r++) {
      const d = E.addDays(first, r);
      if (d < lo || d > hi) continue;
      const fut = d > C.today;
      const n = cd.counts[d] || 0;
      if (!fut) total += n;
      const lv = fut ? -1 : cd.level(n);
      g += `<rect class="cell${fut ? ' future' : lv ? ` l${lv}` : ''}${state.heatDay === d ? ' sel' : ''}" x="${left + w * P}" y="${topPad + r * P}" width="${cell}" height="${cell}" data-act="heat-day" data-day="${d}"><title>${fut ? '' : `${n ? n : 'No'} contribution${n === 1 ? '' : 's'} on ${MONL[E.parseISO(d).getMonth()]} ${E.parseISO(d).getDate()}${n ? '' : '.'}`}</title></rect>`;
    }
  }
  for (const [r, l] of [[1, 'Mon'], [3, 'Wed'], [5, 'Fri']]) g += `<text class="dl" x="0" y="${topPad + r * P + 9}">${l}</text>`;
  return { svg: `<svg class="heat" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Contribution graph">${g}</svg>`, total };
}

function initSheetDrag() {
  const card = $('#sheet-card');
  let y0 = null, dy = 0, t0 = 0, pid = null;
  card.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('[data-grip]') || !window.matchMedia('(max-width: 640px)').matches) return;
    y0 = e.clientY; dy = 0; t0 = performance.now(); pid = e.pointerId;
    try { card.setPointerCapture(pid); } catch (err) { /* ignore */ }
  });
  card.addEventListener('pointermove', (e) => {
    if (y0 == null || e.pointerId !== pid) return;
    dy = Math.max(0, e.clientY - y0);
    card.style.transform = `translateY(${dy}px)`;
  });
  const end = (e) => {
    if (y0 == null || e.pointerId !== pid) return;
    const speed = dy / Math.max(1, performance.now() - t0);
    y0 = null;
    if (dy > 110 || (dy > 30 && speed > 0.6)) return dismissSheet();
    if (dy > 0 && card.animate && !reduceMotion()) card.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.22, 1, .36, 1)' });
    card.style.transform = '';
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 192, c = document.createElement('canvas'); c.width = S; c.height = S;
      const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, S, S); x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
function parentCm(k) {
  const num = (s) => Number((($(s) || {}).value || '').trim()) || 0;

}

async function submitCheckout() {
  const co = state.co; if (!co) return;
  C = compute();
  const { today, nowMin } = C;
  const rec = recOf(co.id);
  if (!rec) { state.co = null; closeSheet(); return; }
  const doneIds = co.rows.filter((r) => r.done).map((r) => r.id);
  const fin = co.rows.length > 0 && co.rows.every((r) => r.done);

  state.co = null; closeSheet();
  if (state.focus) closeFocus();
  ensureAudio();
  if (!(await Data.checkin(today, patch))) return;
  for (const id of doneIds) await Data.updateTask(id, { done: true, doneAt: new Date().toISOString(), doneDay: today });
  for (const r of co.rows) if (!r.done && r.left) await Data.updateTask(r.id, { minutes: r.left, est: 'real' });
  await closeBlock(co.id, 'done', true);
  const a = curAct();
  if (a && a.k === ROLE_ACT[rec.role]) await setAct(null, { quiet: true });

  if (xp) xpFloat(`+${xp} XP`, $('#now'));

}

document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.dataset.act === 'step') return stepToggle(t.dataset.date, t.dataset.id, t.dataset.step, t.checked);
  if (t.dataset.wk) {
    const T = wkT(), r = T && T.rows[Number(t.dataset.i)], k = t.dataset.wk;
    if (!r) return;
    if ((k === 'start' || k === 'end') && !/^\d{2}:\d{2}$/.test(t.value)) return;
    r[k] = k === 'label' ? (t.value.trim().slice(0, 80) || r.label) : t.value;
    return syncWeekButtons();
  }
  if (t.dataset.wkd != null) { weekDraft().defaults[Number(t.dataset.wkd)] = t.value; return syncWeekButtons(); }
  if (t.dataset.wkalt != null) {
    if (!t.value) return;
    const W = weekDraft(), w = t.dataset.wkalt; W.variants = W.variants || {};
    W.variants[w] = (W.variants[w] || []).concat([t.value]);
    t.blur(); return render();
  }
  if (t.id === 'tpl-name') { const T = wkT(); if (T) T.name = t.value.trim().slice(0, 40) || T.name; return syncWeekButtons(); }
  if (t.id === 'tpl-work') { const T = wkT(); if (T) { if (t.checked) T.work = true; else delete T.work; } return syncWeekButtons(); }
  if (t.dataset.pref) {
    const k = t.dataset.pref;
    if (k === 'notify' && t.checked) {
      let ok = false;
      try { ok = 'Notification' in window && (Notification.permission === 'granted' || (await Notification.requestPermission()) === 'granted'); } catch (e) { ok = false; }
      if (!ok) { t.checked = false; toast('Notifications are blocked here. On your own copy of Offload, allow them in the browser.'); return; }
    }
    if (k === 'motion') { setPref('motion', t.checked ? 'reduce' : 'system'); applyTheme(); return render(); }
    setPref(k, t.checked);
    return render();
  }
  if (t.dataset.grpActive) {
    const g = t.dataset.grpActive, set = (W) => { if (W.groups && W.groups[g]) W.groups[g].active = t.checked; };
    const W = JSON.parse(JSON.stringify(weekData())); set(W);

    state.scanFile = f || null;

  if (mod && !ev.altKey && ev.key.toLowerCase() === 'k') { ev.preventDefault(); return state.palette ? closePalette() : openPalette(); }

  }

    const k = ev.key.toLowerCase(), j = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
    if (k.length === 1 && j >= 0 && q.picks[q.i] == null) { ev.preventDefault(); return pickAnswer(j); }
    if (ev.key === 'Enter' && q.picks[q.i] != null && !(t && t.closest && t.closest('button'))) { ev.preventDefault(); return nextQuestion(); }
  }

  }

});

// ---------- pointer, charts, details, visibility ----------
document.addEventListener('pointerdown', () => { ptrDown = true; ptrAt = Date.now(); if (state.settings.sound !== false && (!audio || audio.state !== 'running')) ensureAudio(); }, true);
const ptrUp = () => { ptrDown = false; clearTimeout(pendT); pendT = 0; if (pending) { pending = false; setTimeout(render, 0); } };
document.addEventListener('pointerup', ptrUp, true);
document.addEventListener('pointercancel', ptrUp, true);
let tipWrap = null;
function chartPointer(e) {
  const wrap = e.target.closest && e.target.closest('[data-chart-wrap]');
  if (tipWrap && tipWrap !== wrap) { const id = tipWrap.dataset.chartWrap, tp = $(`#${id}-tip`), x = $(`#${id}-x`); if (tp) tp.hidden = true; if (x) x.setAttribute('visibility', 'hidden'); tipWrap = null; }
  if (wrap) { tipWrap = wrap; chartHover(e); }
}
document.addEventListener('pointermove', chartPointer, { passive: true });
document.addEventListener('pointerdown', chartPointer, { passive: true });
document.addEventListener('toggle', (ev) => { const d = ev.target; if (d && d.dataset && d.dataset.k) { if (d.open) state.openSets.add(d.dataset.k); else state.openSets.delete(d.dataset.k); } }, true);
// After typing in a view, redraw it once focus moves on (views hold still while you type).
document.addEventListener('focusout', (ev) => {
  const t = ev.target, to = ev.relatedTarget;
  if (!t || !/INPUT|SELECT|TEXTAREA/.test(t.tagName) || !t.closest('.view')) return;
  if (to && to.closest && to.closest('.view') && /INPUT|SELECT|TEXTAREA/.test(to.tagName)) return;
