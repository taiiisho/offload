});
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(render, 160); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { guardHide(); return; }
  if (state.focus) grabWake();
  guardShow();
  render();
});

// ---------- the clock ----------
function focusTick(ms) {
  if (!focusMx || !C) return;
  const cur = curBlock();
  if (timer.running) focusMx.set(timerDisplay());
  else if (cur) focusMx.set(fmtLeft(Math.ceil((atMinute(C.today, cur.end) - ms) / 1000)));
}
// The pill in the header keeps what's running in view from every page: the timer first, else the current block.
function nowPill(ms) {
  const el = $('#hdr-now'); if (!el) return;
  let nm = '', t = '', what = 'left';
  if (timer.running) {
    nm = timer.mode === 'focus' ? (timer.phase === 'break' ? 'Break' : timer.label || 'Focus') : timer.mode === 'countdown' ? timer.label || 'Timer' : 'Stopwatch';
    t = timerDisplay(); if (timer.mode === 'stopwatch') what = 'elapsed';
  } else if (C && state.week && C.pos.state === 'block' && (state.tab !== 'today' || window.scrollY > 420)) {
    nm = C.pos.cur.label; t = fmtLeft(Math.ceil(Math.max(0, atMinute(C.today, C.pos.cur.end) - ms) / 1000));
  }
  if (el.hidden !== !t) el.hidden = !t;
  if (!t) return;
  setText($('#hdr-now-nm'), nm); setText($('#hdr-now-t'), t);
  const label = `${nm}, ${t} ${what}. Open focus view.`;
  if (el.getAttribute('aria-label') !== label) el.setAttribute('aria-label', label);
}
function docTitle(ms) {
  let t = 'Offload';
  if (timer.running) t = `${timerDisplay()} · ${timer.mode === 'focus' ? (timer.phase === 'break' ? 'Break' : 'Focus') : timer.mode === 'countdown' ? 'Timer' : 'Stopwatch'} · Offload`;
  else if (C && activeSession()) { const s = activeSession(); t = `${fmtLeft(Math.ceil((atMinute(C.today, s.b.end) - ms) / 1000))} · ${s.b.label} · Offload`; }
  if (document.title !== t) document.title = t;
}
function tick(fromDraw) {
  const now = nowDate(), ms = now.getTime();
  if (!fromDraw && C && ((now.getHours() * 60 + now.getMinutes()) !== C.nowMin || E.iso(now) !== C.today)) render();
  if (state.tab === 'today' && clockMx) {
    clockMx.set(clockText(now));
    const pm = now.getHours() >= 12;
    $$('#ampm span').forEach((s) => s.classList.toggle('on', (s.dataset.ap === 'PM') === pm));
    if (prefs.seconds !== false && secTrack) {
      secTrack.set(now.getSeconds());
      const s = $('#clk-s'), v = ':' + pad2(now.getSeconds()); if (s.textContent !== v) s.textContent = v;
    }
    if (nowSpan && nowMx && !$('#now-mx').hidden) {
      const [a, b] = nowSpan;
      nowMx.set(fmtLeft(Math.ceil(Math.max(0, b - ms) / 1000)));
      const bar = $('#now-bar i'); if (bar) bar.style.width = `${(clamp((ms - a) / Math.max(1, b - a), 0, 1) * 100).toFixed(2)}%`;
    }
  }
  timerTick();
  if (state.focus) focusTick(ms);
  nowPill(ms);
  docTitle(ms);
}

// ---------- boot ----------
function registerSW() {
  try {
    if (IN_VIEWER || window.top !== window.self || !('serviceWorker' in navigator)) return;
    if (!(location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* not available */ }
}
// The tiger sleeps on a line: at the foot of the sidebar on wide screens, at the foot of Today on phones.
const railMQ = window.matchMedia ? window.matchMedia('(min-width: 1024px)') : null;
function placeNook() {
  const nook = $('#nook'), rail = $('.rail'), foot = $('.rail-foot'), wide = railMQ ? railMQ.matches : true;
  if (wide && nook.parentElement !== rail) rail.insertBefore(nook, foot);

}

  hydrateIcons(document);
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  $('#kbd-k').textContent = mac ? '⌘K' : 'Ctrl K';

  if (window.__OFFLOAD_TEST__) window.__offload = { state, timer, get C() { return C; }, AI };
  tigerInit();
  state.enterTab = state.tab;
  draw();
  const top = $('#top'), onScroll = () => { top.classList.toggle('scrolled', window.scrollY > 6); if (state.tab === 'today') nowPill(nowMs()); };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
